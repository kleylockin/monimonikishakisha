<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MNI CAFE</title>
<style>
:root{--pink:#ffd6e8;--pinkdd:#ff6fa8;--white:#fff8fb;--text:#5a3040;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--white);font-family:'Trebuchet MS',sans-serif;overflow:hidden;color:var(--text)}
#wrap{position:relative;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(#ffeef5,#ffd9e9)}
canvas{background:#fff0f6;border:6px solid var(--pinkdd);border-radius:14px;box-shadow:0 8px 24px rgba(255,110,168,.35);max-width:96vw;max-height:80vh;image-rendering:pixelated}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:linear-gradient(#ffe3f0,#ffc9e2);text-align:center;padding:20px;z-index:20}
.hidden{display:none!important}
h1{font-size:clamp(26px,6vw,52px);color:var(--pinkdd);text-shadow:2px 2px 0 #fff;margin:0}
.sub{font-style:italic;color:#b5657f;margin-top:-8px}
button{font-size:15px;padding:9px 24px;border-radius:20px;border:2px solid var(--pinkdd);background:#fff;color:var(--pinkdd);font-weight:bold;cursor:pointer;box-shadow:0 3px 0 var(--pinkdd)}
button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--pinkdd)}
.menuBtns{display:flex;flex-direction:column;gap:10px;width:220px}
#hud{position:absolute;top:14px;left:14px;background:rgba(255,255,255,.88);border:2px solid var(--pinkdd);border-radius:10px;padding:6px 10px;font-size:13px;line-height:1.5;z-index:10}
#orders{position:absolute;top:14px;left:150px;background:rgba(255,255,255,.9);border:2px solid var(--pinkdd);border-radius:10px;padding:6px 10px;font-size:12px;z-index:10;max-width:210px;max-height:150px;overflow:auto}
.ordRow{border-bottom:1px dashed #f3b8cd;padding:3px 0}
.pbar{background:#f3d5e0;border-radius:6px;height:6px;overflow:hidden;margin-top:2px}
.pfill{background:#ff8fbd;height:100%}
#dialogue{position:absolute;bottom:16px;left:5%;right:5%;background:rgba(255,248,251,.96);border:3px solid var(--pinkdd);border-radius:16px;padding:14px 18px;display:none;z-index:15}
#dName{font-weight:bold;color:var(--pinkdd)}
#dText{margin-top:4px;min-height:24px}
#hint{position:absolute;bottom:4px;right:14px;font-size:11px;color:#a56;opacity:.8;z-index:10}
#toast{position:absolute;top:70px;left:50%;transform:translateX(-50%);background:#fff;border:2px solid var(--pinkdd);border-radius:14px;padding:6px 16px;font-size:13px;font-weight:bold;color:var(--pinkdd);opacity:0;transition:opacity .3s;z-index:16;pointer-events:none}
#letterOverlay{position:absolute;inset:0;background:rgba(255,220,235,.9);display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;z-index:25}
.letterCard{background:#fffdf7;border:2px dashed var(--pinkdd);border-radius:10px;padding:24px;max-width:340px;font-style:italic;box-shadow:0 6px 20px rgba(0,0,0,.15)}
#lettersMenu{position:absolute;inset:0;background:#ffe9f2;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:25}
.letterGrid{display:grid;grid-template-columns:repeat(3,90px);gap:10px}
.lbox{background:#fff;border:2px solid var(--pinkdd);border-radius:10px;height:60px;display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer}
.lbox.locked{opacity:.35;cursor:default}
#topBtns{position:absolute;top:14px;right:14px;display:flex;gap:8px;z-index:10}
#topBtns button{padding:6px 14px;font-size:13px}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity 1.4s;z-index:40}
#kishaPreview{width:110px;image-rendering:pixelated;filter:drop-shadow(0 4px 6px rgba(0,0,0,.2))}
</style>
</head>
<body>
<div id="wrap">

<div id="menu" class="screen">
  <h1>MNI CAFE</h1>
  <div class="sub">"Some letters are meant to be read."</div>
  <div class="menuBtns">
    <button onclick="goSelect()">START</button>
    <button onclick="openLetters()">LETTERS</button>
    <button onclick="alert('Thanks for playing MNI CAFE 💌')">EXIT</button>
  </div>
</div>

const MENU=[{name:'Coffee',icon:'☕',price:5},{name:'Tea',icon:'🍵',price:4},{name:'Milk Tea',icon:'🧋',price:7},{name:'Cake',icon:'🍰',price:6},{name:'Croissant',icon:'🥐',price:5}];

/* ================= LETTERS / STORY ================= */
const LETTERS=[
 "I don't know why, but talking to you makes my day feel lighter.",
 "I think I look forward to seeing you more than I look forward to my coffee.",
 "Even on my worst days, this little café feels warmer because you're in it.",
 "I keep replaying our conversations after I leave. Is that strange?",
 "I'm sorry I haven't come by. I promise it isn't because I forgot you.",
 "I miss the sound of your voice more than I expected to.",
 "You probably think I disappeared. I didn't. I was just scared.",
 "Every letter in this jar was written for you, Kisha. Every single one.",
];
let unlocked=[false,false,false,false,false,false,false,false];
const DAY_INTRO={
 6:[["KISHA","Maybe he'll come tomorrow..."]],
 7:[["KISHA","I wonder where he is."]],
 8:[["KISHA","Why haven't you come back?"]],
 9:[["KISHA","I miss talking to you."]],
};
const MONI_TALK={
 1:[["MONI","Hi..."],["KISHA","Hi. Welcome to MNI Cafe."],["MONI","This place is nice."],["KISHA","Thank you."],["MONI","I think I'll come back."]],
 3:[["MONI","You remembered me."],["KISHA","You're becoming a regular."],["MONI","Maybe I want to be."]],
 5:[["MONI","Kisha..."],["KISHA","Hmm?"],["MONI","Never mind."],["KISHA","You were going to say something."],["MONI","Maybe next time."]],
};
const CONFESSION=[
 ["MONI","Kisha..."],["KISHA","Moni?"],["MONI","I'm sorry I disappeared."],
 ["KISHA","I thought you weren't coming back."],["MONI","I had something I needed to finish."],
 ["MONI","The letters..."],["MONI","They're all for you."],["KISHA","For... me?"],
 ["MONI","Every single one. I couldn't say it out loud, so I wrote it instead."],
];
const moniDays=[1,3,5];

/* ================= WORLD ================= */
const WORLD_W=1400, WORLD_H=820, VIEW_W=720, VIEW_H=440;
const tables=[
  {x:100,y:160},{x:100,y:340},{x:100,y:520},
  {x:420,y:160},{x:420,y:520},
  {x:760,y:160},{x:760,y:340},{x:760,y:520},
  {x:1080,y:160},{x:1080,y:520},
].map(t=>({...t,state:'available',cust:null}));
function seat(t){return {x:t.x+45,y:t.y+70};}
function tableRect(t){return {x:t.x,y:t.y+40,w:90,h:60};}
const jarSpot={x:WORLD_W-140,y:70,w:80,h:70};
const station={x:230,y:100,w:70,h:50};
const doorInside={x:70,y:345}, doorOutside={x:-50,y:345};
const counterRect={x:0,y:60,w:WORLD_W,h:60};

/* ================= STATE ================= */
let day=1, money=25, energy=100;
let dialogueQueue=[], dialogueActive=false, paused=false, cutscene=false;
let onDialogueEnd=null;
let keys={};
let player={x:300,y:450,w:34,h:56,speed:3.1,facing:1,moving:false};
let camX=0,camY=0,animT=0;
let customers=[]; // active
let nextId=1;
let nurseSpawnTimer=100, moniTimer=220;
let prep=null; // {custId,item,timer,dur}
let carry=null; // {custId,item}
let moniSpawnedToday=false, moniObj=null;
let day10CutscenePlayed=false;

/* ================= UI helpers ================= */
function show(id){document.getElementById(id).classList.remove('hidden');}
function hide(id){document.getElementById(id).classList.add('hidden');}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.style.opacity=1;clearTimeout(t._h);t._h=setTimeout(()=>t.style.opacity=0,1400);}
function updateHud(){document.getElementById('hud').innerHTML=`Day ${day}<br>💰 $${money}<br>⚡ ${energy}%`;}
function updateOrdersUI(){
  const el=document.getElementById('ordersList'); el.innerHTML='';
  customers.filter(c=>c.state==='waiting').forEach(c=>{
    const pct=Math.max(0,c.patience);
    el.innerHTML+=`<div class="ordRow">${c.isMoni?'MONI':'Customer'} ${c.order.icon} ${c.order.name} — $${c.order.price}<div class="pbar"><div class="pfill" style="width:${pct}%"></div></div></div>`;
  });
}

/* ================= MENU FLOW ================= */
function goSelect(){show('select');hide('menu');}
function startGame(){
  hide('select'); show('game'); show('hud'); show('orders'); show('hint'); show('topBtns');
  updateHud(); runDayIntro();
  requestAnimationFrame(loop);
}
function runDayIntro(){ if(DAY_INTRO[day]) queueDialogue(DAY_INTRO[day]); spawnNurse(); spawnNurse(); }
function endDay(){
  if(day===10 && !day10CutscenePlayed){ playConfessionCutscene(); return; }
  if(day>=10) return;
  day++; energy=100; moniSpawnedToday=false;
  nurseSpawnTimer=60; moniTimer=200+Math.random()*150;
  customers=customers.filter(c=>false); tables.forEach(t=>{t.state='available';t.cust=null;});
  updateHud(); runDayIntro();
}
function togglePause(){ paused=!paused; if(paused) show('pauseMenu'); else hide('pauseMenu'); }

/* ================= DIALOGUE ================= */
function queueDialogue(lines){ dialogueQueue=dialogueQueue.concat(lines); if(!dialogueActive) nextDialogue(); }
function nextDialogue(){
  if(dialogueQueue.length===0){
    dialogueActive=false; document.getElementById('dialogue').style.display='none';
    if(onDialogueEnd){const f=onDialogueEnd; onDialogueEnd=null; f();}
    return;
  }
  dialogueActive=true;
  const [n,t]=dialogueQueue.shift();
  document.getElementById('dialogue').style.display='block';
  document.getElementById('dName').textContent=n; document.getElementById('dText').textContent=t;
}
window.addEventListener('keydown',e=>{
  keys[e.key]=true;
  if(e.key==='Escape'){ if(!cutscene) togglePause(); return; }
  if(e.key==='e'||e.key==='E'||e.key===' '){
    if(dialogueActive){ nextDialogue(); return; }
    if(!paused && !cutscene) tryInteract();
  }
});
window.addEventListener('keyup',e=>{keys[e.key]=false;});

/* ================= INTERACTION ================= */
function near(ax,ay,bx,by,r){return Math.abs(ax-bx)<r && Math.abs(ay-by)<r;}
function tryInteract(){
  if(near(player.x,player.y,jarSpot.x+40,jarSpot.y+40,70)){ openJar(); return; }
  if(near(player.x,player.y,station.x+35,station.y+25,70)){ stationInteract(); return; }
  for(const t of tables){
    const c=seat(t);
    if(near(player.x,player.y,c.x,c.y,60)){
      if(t.state==='dirty'){ t.state='available'; toast('Table cleaned! ✨'); return; }
      const cust=customers.find(u=>u.tableIdx===tables.indexOf(t) && u.state==='waiting');
      if(cust && carry && carry.custId===cust.id){
        cust.state='eating'; cust.eatTimer=180; carry=null; toast(cust.order.icon+' Order delivered!');
        if(cust.isMoni && MONI_TALK[day]) queueDialogue(MONI_TALK[day]);
        return;
      }
      return;
    }
  }
}
function stationInteract(){
  if(carry){ toast("Kisha's hands are full."); return; }
  if(prep && prep.timer>=prep.dur){ carry={custId:prep.custId,item:prep.item}; toast(prep.item.icon+' Picked up!'); prep=null; return; }
  if(prep){ toast('Still preparing... '+Math.floor(prep.timer/prep.dur*100)+'%'); return; }
  const target=customers.find(c=>c.state==='waiting');
  if(!target){ toast('No orders waiting.'); return; }
  prep={custId:target.id,item:target.order,timer:0,dur:90};
  toast('Making '+target.order.name+'...');
}
const LETTER_DAY={1:0,3:1,5:2,6:3,7:4,8:5,9:6};
function openJar(){
  const idx=LETTER_DAY[day];
  if(idx===undefined){
    toast(unlocked.some(u=>u)?"Kisha isn't ready to read another one yet.":"Kisha decides to wait before reading.");
    return;
  }
  if(!unlocked[idx]){ unlocked[idx]=true; showLetterOverlay(LETTERS[idx]); }
  else showLetterOverlay("You've already read this one. Check MENU → LETTERS.");
}
function showLetterOverlay(t){document.getElementById('letterCardText').textContent=t;document.getElementById('letterOverlay').style.display='flex';}
function closeLetterOverlay(){document.getElementById('letterOverlay').style.display='none';}
function openLetters(){
  const grid=document.getElementById('letterGrid'); grid.innerHTML='';
  LETTERS.forEach((t,i)=>{const d=document.createElement('div');d.className='lbox'+(unlocked[i]?'':' locked');d.textContent=unlocked[i]?'💌':'🔒';d.onclick=()=>{if(unlocked[i])showLetterOverlay(t);};grid.appendChild(d);});
  document.getElementById('lettersMenu').style.display='flex';
}
function closeLettersMenu(){document.getElementById('lettersMenu').style.display='none';}

/* ================= CUSTOMER AI ================= */
function spawnNurse(){
  const freeTables=tables.map((t,i)=>i).filter(i=>tables[i].state==='available' && !customers.some(c=>c.tableIdx===i));
  if(freeTables.length===0) return;
  const idx=freeTables[Math.floor(Math.random()*freeTables.length)];
  tables[idx].state='occupied';
  const type=NURSE_TYPES[Math.floor(Math.random()*NURSE_TYPES.length)];
  const [mood,line]=NURSE_LINES[Math.floor(Math.random()*NURSE_LINES.length)];
  const hues=[0,50,140,200,260,320];
  const c={id:nextId++,img:type,x:doorOutside.x,y:doorOutside.y,tableIdx:idx,state:'entering',
    path:[{...doorInside},seat(tables[idx])],mood,line,order:null,patience:100,isMoni:false,speed:1.4+Math.random()*0.5,
    hue:hues[Math.floor(Math.random()*hues.length)]};
  customers.push(c);
}
function spawnMoni(){
  const freeTables=tables.map((t,i)=>i).filter(i=>tables[i].state==='available');
  if(freeTables.length===0) return;
  const idx=freeTables[Math.floor(Math.random()*freeTables.length)];
  tables[idx].state='occupied';
  moniObj={id:nextId++,img:'moni',x:doorOutside.x,y:doorOutside.y,tableIdx:idx,state:'entering',
    path:[{...doorInside},seat(tables[idx])],order:null,patience:999,isMoni:true,speed:1.5};
  customers.push(moniObj); moniSpawnedToday=true;
}
function stepTowards(c,dt){
  if(c.path.length===0) return true;
  const p=c.path[0]; const dx=p.x-c.x, dy=p.y-c.y; const d=Math.hypot(dx,dy);
  if(d<3){ c.path.shift(); return c.path.length===0; }
  c.x+=dx/d*c.speed*dt; c.y+=dy/d*c.speed*dt; c.facing=dx<0?-1:1;
  return false;
}
function updateCustomers(dt){
  for(const c of customers.slice()){
    if(c.state==='entering'){ if(stepTowards(c,dt)) c.state='sitting'; }
    else if(c.state==='sitting'){
      c.order = c.isMoni ? MENU[0] : MENU[Math.floor(Math.random()*MENU.length)];
      c.state='waiting'; c.patience=100;
    }
    else if(c.state==='waiting'){
      c.patience-=0.06*dt;
      if(c.patience<=0){
        toast((c.isMoni?'Moni':'A customer')+" left without paying...");
        tables[c.tableIdx].state='dirty';
        c.state='leaving'; c.path=[{...doorInside},{...doorOutside}];
        if(c.isMoni) moniObj=null;
      }
    }
    else if(c.state==='eating'){
      c.eatTimer-=dt;
      if(c.eatTimer<=0){
        money+=c.order.price; updateHud(); toast('+$'+c.order.price+' 💰');
        tables[c.tableIdx].state='dirty';
        c.state='leaving'; c.path=[{...doorInside},{...doorOutside}];
        if(c.isMoni){
          moniObj=null;
          if(moniDays.includes(day)) queueDialogue([[ 'NARRATOR','Another letter is waiting in the jar...' ]]);
        }
      }
    }
    else if(c.state==='leaving'){
      if(stepTowards(c,dt)){ customers.splice(customers.indexOf(c),1); }
    }
    else if(c.state==='cutscene_walk'){
      if(stepTowards(c,dt)){ c.state='cutscene_talk'; startEndingSequence(); }
    }
  }
  updateOrdersUI();
}

/* ================= DAY10 CUTSCENE ================= */
function playConfessionCutscene(){
  cutscene=true; day10CutscenePlayed=true;
  const fade=document.getElementById('fade'); fade.style.opacity=1;
  setTimeout(()=>{
    fade.style.opacity=0;
    moniObj={id:nextId++,img:'moni',x:doorOutside.x,y:doorOutside.y,tableIdx:-1,state:'cutscene_walk',
      path:[{...doorInside},{x:player.x-10,y:player.y-10}],order:null,patience:999,isMoni:true,speed:1.3,flowers:true};
    customers.push(moniObj);
  },1500);
}
function startEndingSequence(){
  cutscene=false;
  unlocked=unlocked.map(()=>true);
  const reveal=LETTERS.map((t,i)=>["LETTER "+String(i+1).padStart(2,'0'), t]);
  queueDialogue([
    ...CONFESSION,
    ...reveal,
    ["NARRATOR","Kisha and Moni step outside together, into the pink evening light."],
    ["NARRATOR","MNI CAFE — A little café. A few letters. And a love story."],
    ["NARRATOR","THE END 💌"]
  ]);
}

/* ================= PLAYER / RENDER ================= */
function collide(nx,ny){
  const pb={x:nx-player.w/2,y:ny-player.h/2,w:player.w,h:player.h};
  if(pb.x<0||pb.y<0||pb.x+pb.w>WORLD_W||pb.y+pb.h>WORLD_H) return true;
  if(pb.y<counterRect.h && pb.x>20 && pb.x+pb.w<WORLD_W-20) return true;
  for(const t of tables){ const r=tableRect(t); if(pb.x<r.x+r.w&&pb.x+pb.w>r.x&&pb.y<r.y+r.h&&pb.y+pb.h>r.y) return true; }
  return false;
}
function update(dt){
  if(!dialogueActive && !paused && !cutscene){
    let dx=0,dy=0;
    if(keys['w']||keys['ArrowUp']) dy=-player.speed;
    if(keys['s']||keys['ArrowDown']) dy=player.speed;
    if(keys['a']||keys['ArrowLeft']){dx=-player.speed;player.facing=-1;}
    if(keys['d']||keys['ArrowRight']){dx=player.speed;player.facing=1;}
    player.moving=(dx!==0||dy!==0);
    const nx=player.x+dx, ny=player.y+dy;
    if(!collide(nx,player.y)) player.x=nx;
    if(!collide(player.x,ny)) player.y=ny;
  } else player.moving=false;
  camX=Math.max(0,Math.min(WORLD_W-VIEW_W,player.x-VIEW_W/2));
  camY=Math.max(0,Math.min(WORLD_H-VIEW_H,player.y-VIEW_H/2));

  if(!paused && !dialogueActive){
    updateCustomers(dt);
    if(prep && prep.timer<prep.dur) prep.timer+=dt;
    if(!cutscene){
      nurseSpawnTimer-=dt;
      if(nurseSpawnTimer<=0 && customers.filter(c=>!c.isMoni).length<6){ spawnNurse(); nurseSpawnTimer=140+Math.random()*120; }
      if(!moniSpawnedToday && moniDays.includes(day) && !moniObj){
        moniTimer-=dt; if(moniTimer<=0){ spawnMoni(); moniTimer=999999; }
      }
    }
  }
}
function drawPerson(img,x,y,facing,label,flowers,hue){
  ctx.save(); ctx.translate(x-camX,y-camY); if(facing<0) ctx.scale(-1,1);
  if(img && IMGS[img] && IMGS[img].complete && IMGS[img].naturalWidth>0){
    if(hue){ ctx.filter='hue-rotate('+hue+'deg) saturate(1.15)'; }
    ctx.drawImage(IMGS[img],-30,-92,60,92);
    ctx.filter='none';
  } else {
    ctx.fillStyle='#dfe6ee'; ctx.fillRect(-18,-40,36,42);
    ctx.fillStyle='#ffe3ce'; ctx.beginPath(); ctx.arc(0,-50,15,0,7); ctx.fill();
    ctx.fillStyle='#2b2320'; ctx.beginPath(); ctx.arc(0,-55,16,Math.PI,2*Math.PI); ctx.fill();
  }
  ctx.restore();
  ctx.fillStyle='#5a3040'; ctx.font='11px sans-serif'; ctx.textAlign='center';
  ctx.fillText(label,x-camX,y-98-camY);
  if(flowers){ ctx.font='20px sans-serif'; ctx.fillText('💐',x-camX+18,y-40-camY); }
}
function render(){
  ctx.clearRect(0,0,VIEW_W,VIEW_H);
  ctx.fillStyle= day>=6?'#f4dfe8':'#fff0f6'; ctx.fillRect(0,0,VIEW_W,VIEW_H);
  ctx.strokeStyle='rgba(255,182,209,.35)';
  for(let gx=0;gx<WORLD_W;gx+=60){ctx.beginPath();ctx.moveTo(gx-camX,-camY);ctx.lineTo(gx-camX,WORLD_H-camY);ctx.stroke();}
  ctx.fillStyle='#f7c9dd'; ctx.fillRect(-camX,-camY,WORLD_W,60);
  ctx.fillStyle='#fff'; ctx.font='20px sans-serif'; ctx.textAlign='left'; ctx.fillText('MNI CAFE ☕',20-camX,40-camY);
  ctx.fillStyle='#8a5a3c'; ctx.fillRect(doorInside.x-30-camX, 300-camY, 18, 90);
  // station
  ctx.fillStyle='#e7b98f'; ctx.fillRect(station.x-camX,station.y-camY,station.w,station.h);
  ctx.font='24px sans-serif'; ctx.textAlign='center'; ctx.fillText('☕',station.x+35-camX,station.y+34-camY);
  if(prep){ ctx.fillStyle='#fff'; ctx.fillRect(station.x-camX,station.y-14-camY,70,8);
    ctx.fillStyle='#ff8fbd'; ctx.fillRect(station.x-camX,station.y-14-camY,70*Math.min(1,prep.timer/prep.dur),8); }
  // tables
  tables.forEach((t,i)=>{
    ctx.fillStyle='#a9764f'; ctx.fillRect(t.x-camX,t.y+40-camY,90,30);
    ctx.fillStyle= t.state==='dirty' ? '#c9967a' : '#c99a6f'; ctx.fillRect(t.x+15-camX,t.y-camY,60,55);
    if(t.state==='dirty'){ ctx.font='16px sans-serif'; ctx.fillText('🧽',t.x+45-camX,t.y-6-camY); }
  });
  // jar
  ctx.fillStyle='#fff'; ctx.fillRect(jarSpot.x-camX,jarSpot.y-camY,jarSpot.w,jarSpot.h);
  ctx.strokeStyle='#ff9ec7'; ctx.lineWidth=3; ctx.strokeRect(jarSpot.x-camX,jarSpot.y-camY,jarSpot.w,jarSpot.h);
  ctx.fillStyle='#c96a91'; ctx.font='11px sans-serif'; ctx.fillText('For Kisha 💌',jarSpot.x+40-camX,jarSpot.y-6-camY);
  ctx.font='30px sans-serif'; ctx.fillText('🫙',jarSpot.x+40-camX,jarSpot.y+46-camY);
  // customers
  customers.forEach(c=>{
    const label=c.isMoni?'MONI':'⚕️ Nurse';
    drawPerson(c.img,c.x,c.y,c.facing||1,label,c.flowers,c.hue);
    if(c.state==='waiting'){ ctx.font='16px sans-serif'; ctx.fillText(c.order.icon,c.x-camX,c.y-104-camY); }
  });
  // player
  animT+=player.moving?0.25:0;
  drawPerson('kisha',player.x,player.y,player.facing,'',false);
  if(carry){ ctx.font='20px sans-serif'; ctx.fillText(carry.item.icon,player.x-camX+16,player.y-90-camY); }
}
const cvs=document.getElementById('game'), ctx=cvs.getContext('2d');
let last=performance.now();
function loop(t){ const dt=(t-last)/16.6; last=t; update(dt); render(); requestAnimationFrame(loop); }
</script>
</body>
